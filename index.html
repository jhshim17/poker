<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120d08">
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>우리 포커 모임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column (max 640px) under a sticky dark studio header; dark-only "game show" look — black stage, bronze glow, metallic gold for titles and primary actions. */
:root{
  --bg:#0a0806; --surface:#17110c; --sunk:#0f0b08; --ink:#f1e6d2; --muted:#a8977c; --line:#3a2d1e;
  --felt:#120d08; --felt-ink:#f5e7c8; --pos:#f0c35e; --neg:#e3685a; --gold:#dcaa4f; --gold-bg:#211810; --on-gold:#1a1206;
  --plus:#e8b04b; --minus:#d0573f;
  --metal:linear-gradient(180deg,#fff4d6 0%,#f0cf86 32%,#b9822f 58%,#f3d48d 78%,#8a5a1f 100%);
  --metal-btn:linear-gradient(180deg,#f6dc97 0%,#d29a3d 52%,#9c6a24 100%);
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--felt)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--felt);color:var(--felt-ink)}
.hwrap,.main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hwrap{padding-block:12px 0}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;letter-spacing:.01em}
.suits{font-size:13px;opacity:.75;letter-spacing:.3em}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px}
.tab{background:none;border:0;padding:10px 4px 12px;color:var(--felt-ink);opacity:.65;font-weight:500;border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--gold)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.main{padding-block:20px 48px;display:flex;flex-direction:column;gap:24px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-size:17px;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,.slot:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input[type=text],input[type=number],input[type=date],select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.notice{background:var(--gold-bg);border-radius:8px;padding:10px 12px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}

/* schedule */
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav .label{font-family:var(--f-display);font-size:22px;min-width:120px;text-align:center}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;text-align:center;color:var(--muted);padding-bottom:2px}
.cal .dow.sun{color:var(--neg)} .cal .dow.sat{color:#2c5aa0}
.cell{min-height:64px;border-radius:8px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.cell .d{font-family:var(--f-num);font-size:13px;line-height:1}
.cell.wd{color:var(--muted);opacity:.55}
.cell.blank{visibility:hidden}
button.cell{border:1px solid var(--line);background:var(--surface);cursor:pointer}
button.cell.sun .d{color:var(--neg)} button.cell.sat .d{color:#2c5aa0}
button.cell .cnt{font-family:var(--f-num);font-weight:600;font-size:18px;line-height:1.1}
button.cell .cnt.zero{color:var(--line)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:100%}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--felt)}
button.cell.mine{border-color:var(--felt);box-shadow:inset 0 0 0 2px var(--felt)}
button.cell.mine .d::after{content:" ✓";color:var(--felt);font-weight:700}
button.cell.best{background:var(--gold-bg);border-color:var(--gold)}
button.cell.past{opacity:.6}
button.cell:disabled{cursor:default}
button.cell:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{display:inline-block;width:12px;height:12px;border-radius:3px}
.ann{background:var(--felt);color:var(--felt-ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ann.empty{background:var(--surface);color:var(--ink);border:1px dashed var(--line)}
.ann .eb{font-size:11px;letter-spacing:.12em;font-weight:700;opacity:.75}
.ann .when{font-family:var(--f-display);font-size:26px;line-height:1.15}
.ann .when small{font-family:var(--f-body);font-size:14px;opacity:.8;margin-left:6px;white-space:nowrap}
.ann .row2{display:grid;grid-template-columns:20px minmax(0,1fr);gap:6px 8px;font-size:14px;align-items:start}
.ann .row2 span{overflow-wrap:anywhere}
.ann .acts{display:flex;gap:8px;flex-wrap:wrap}
.ann .acts a,.ann .acts button{background:rgba(255,255,255,.14);color:var(--felt-ink);border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:6px 12px;font-size:13px;text-decoration:none;font-family:inherit;cursor:pointer}
.ann .acts a:focus-visible,.ann .acts button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ann .foot{font-size:12px;opacity:.75}
.meetform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meetform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.meetform .full{grid-column:1/-1}
.meetform input{width:100%;min-width:0}
input[type=url]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
button.cell.fixed{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
button.cell.fixed .d,button.cell.fixed .cnt{color:var(--felt-ink)!important}
button.cell.fixed .dots i{background:var(--gold)}
.fixtag{font-size:9px;font-weight:700;color:var(--gold);line-height:1}
.fixbtn{font-size:12px;padding:3px 8px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;white-space:nowrap}
.daylist{margin:0;padding:0;list-style:none}
.daylist li{display:grid;grid-template-columns:76px minmax(0,1fr) 28px auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}
.daylist li:last-child{border-bottom:0}
.top3{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.top3 li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.top3 li:last-child{border-bottom:0}

/* stats */
.board{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:28px minmax(52px,72px) 1fr 70px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.rank{font-family:var(--f-num);color:var(--muted);font-size:13px}
.bar{position:relative;height:14px}
.bar::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;border-left:1px dashed var(--line)}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.amt{text-align:right;font-family:var(--f-num);font-weight:600}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500}
td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--f-body);font-weight:500}
.game{display:flex;flex-direction:column;gap:8px}
.game ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.game li{display:flex;justify-content:space-between;font-size:14px}
.game li .n{display:flex;gap:6px}
.game li .n em{font-style:normal;font-family:var(--f-num);color:var(--muted);font-size:12px}
.crown{color:var(--gold)}
.formrow{display:grid;grid-template-columns:minmax(0,1fr) auto 40px 36px;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 10px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.topbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:36px;cursor:pointer;color:var(--muted)}
.topbtn[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
.legendbox{background:var(--gold-bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;flex:none}
.dot.f{background:var(--plus)} .dot.e{border:2px solid var(--minus)}
.dot.none{border:2px dashed var(--line)}
.dot.big{width:18px;height:18px}
.flow{display:flex;flex-direction:column}
.frow{display:grid;grid-template-columns:72px 1fr;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.dots5{display:flex;gap:10px}
.axis{display:grid;grid-template-columns:72px 1fr;font-size:11px;color:var(--muted)}
.axis>span:last-child{display:flex;justify-content:space-between;width:130px;white-space:nowrap}
.gres{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.gres>span{display:inline-flex;gap:5px;align-items:center}
.sumline{font-size:13px}

/* chips */
.chipset{display:flex;flex-direction:column;gap:6px}
.chipdef{display:grid;grid-template-columns:28px 1fr 90px 36px;gap:6px;align-items:center}
.disc{width:24px;height:24px;border-radius:50%;border:3px dashed rgba(255,255,255,.7);box-shadow:0 0 0 1px var(--line);display:inline-block}
.disc.sm{width:16px;height:16px;border-width:2px}
.player{display:flex;flex-direction:column;gap:10px}
.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.counts label{display:flex;align-items:center;gap:6px;background:var(--sunk);border-radius:8px;padding:4px 6px}
.counts .cname{font-size:12px;color:var(--muted);white-space:nowrap}
.counts input{width:100%;border:0;background:transparent;padding:4px 0;text-align:right}
.ptotal{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.big{font-family:var(--f-num);font-size:22px;font-weight:600}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.settle{margin:0;padding:0;list-style:none}
.settle li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.settle li:last-child{border-bottom:0}
.brand{flex-wrap:wrap}
.mebtn{margin-left:auto;background:rgba(255,255,255,.12);color:var(--felt-ink);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.mebtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,20,15,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--surface);color:var(--ink);border-radius:16px;padding:20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.modal h2{font-family:var(--f-display);font-weight:400;font-size:22px}
.whogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.whogrid button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 4px;font-size:16px;font-weight:500;cursor:pointer}
.whogrid button[aria-pressed="true"]{background:var(--felt);color:var(--felt-ink);border-color:var(--felt)}
.whogrid button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20}
@media (max-width:420px){.settings{grid-template-columns:1fr}.game ol{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.cell,.chip,.btn{transition:background .15s,border-color .15s}}
/* ---- studio theme overrides ---- */
body{background:radial-gradient(120% 55% at 50% -8%,rgba(214,134,40,.30),transparent 62%),radial-gradient(90% 40% at 50% 112%,rgba(150,64,22,.20),transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh}
header{background:linear-gradient(180deg,#140e08 0%,rgba(16,11,7,.94) 100%);border-bottom:1px solid rgba(220,170,79,.38);box-shadow:0 10px 30px rgba(0,0,0,.65)}
.brand h1{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:28px;letter-spacing:.05em;filter:drop-shadow(0 2px 8px rgba(240,160,60,.35))}
.suits{color:var(--gold);opacity:1}
.tab{color:#c9b691;opacity:1;letter-spacing:.06em}
.tab[aria-selected="true"]{color:#ffe7b0;border-bottom-color:var(--gold);text-shadow:0 0 14px rgba(240,180,80,.65)}
h2{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.04em;color:#ecc87e}
.panel{background:linear-gradient(180deg,#1c150e,#120d09);border:1px solid rgba(220,170,79,.28);box-shadow:0 12px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,220,160,.07)}
.btn{background:#1b140e;border-color:#4b3922;color:var(--ink)}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--metal-btn);border-color:#e6b864;color:var(--on-gold);font-weight:700;box-shadow:0 4px 18px rgba(220,150,50,.35);text-shadow:0 1px 0 rgba(255,240,200,.4)}
.btn.ghost{background:transparent}
input[type=text],input[type=number],input[type=date],input[type=url],select{background:#0e0a07;border-color:#4b3922}
.notice{background:rgba(220,170,79,.12);border:1px solid rgba(220,170,79,.3)}
.mebtn{background:rgba(220,170,79,.12);border-color:rgba(220,170,79,.5);color:#f5dca3}
.toast{background:var(--metal-btn);color:var(--on-gold);font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.6)}
.monthnav .label{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
button.cell{background:#16100b;border-color:#3a2d1e}
button.cell.best{background:rgba(220,170,79,.16);border-color:var(--gold)}
button.cell.mine{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
button.cell.mine .d::after{color:var(--gold)}
.dots i{background:var(--gold)}
button.cell.fixed{background:var(--metal-btn);border-color:#f0c56c;box-shadow:0 0 18px rgba(230,160,60,.45)}
button.cell.fixed .d,button.cell.fixed .cnt{color:var(--on-gold)!important}
button.cell.fixed .fixtag{color:#5a3a10}
button.cell.fixed .dots i{background:#5a3a10}
.legend b{border-color:var(--gold)!important}
.ann{background:radial-gradient(120% 120% at 0% 0%,rgba(230,150,50,.25),transparent 55%),linear-gradient(135deg,#2a1c0e,#120c07);border:1px solid rgba(220,170,79,.55);box-shadow:0 14px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,220,160,.1)}
.ann .when{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.ann .when small{-webkit-text-fill-color:#e8d3a8}
.ann .eb{color:var(--gold);opacity:1}
.ann .acts a,.ann .acts button{background:rgba(220,170,79,.12);border-color:rgba(220,170,79,.45);color:#f5dca3}
.ann.empty{background:rgba(23,17,12,.7);border:1px dashed rgba(220,170,79,.4)}
.modal{background:rgba(0,0,0,.7)}
.modal .box{background:linear-gradient(180deg,#1f170f,#110c08);border:1px solid rgba(220,170,79,.5);box-shadow:0 20px 60px rgba(0,0,0,.7)}
.modal h2{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:26px}
.whogrid button{background:#16100b;border-color:#4b3922;color:var(--ink)}
.whogrid button:hover{border-color:var(--gold)}
.whogrid button[aria-pressed="true"]{background:var(--metal-btn);color:var(--on-gold);border-color:#e6b864}
.counts label{background:#0e0a07;border:1px solid #2e2317}
.dot.f{background:radial-gradient(circle at 35% 30%,#ffe7a6,#e8b04b 45%,#a36d1f);box-shadow:0 0 8px rgba(232,176,75,.55)}
.crown{color:#f3c96a;text-shadow:0 0 8px rgba(240,190,90,.6)}
.legendbox{background:rgba(220,170,79,.08);border-color:rgba(220,170,79,.3)}
.brand{flex-wrap:nowrap;align-items:center}
.brand h1{font-size:clamp(21px,6.4vw,28px);white-space:nowrap}
.mebtn{white-space:nowrap;flex:none}
@media (max-width:380px){.suits{display:none}}
.cal .dow.sat,button.cell.sat .d{color:#d9c9a3}
.cal .dow.sun,button.cell.sun .d{color:#ef8a76}
</style>

</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><h1>우리 포커 모임</h1><span class="suits">♠♥♦♣</span><button class="mebtn" id="meBtn" type="button" hidden></button></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-sched" data-tab="sched" aria-selected="true">주말 일정</button>
      <button class="tab" role="tab" id="tab-stats" data-tab="stats" aria-selected="false">게임 기록</button>
      <button class="tab" role="tab" id="tab-calc" data-tab="calc" aria-selected="false">칩 계산</button>
    </div>
  </div>
</header>
<main class="main" id="app"></main>
<div class="modal" id="whoModal" role="dialog" aria-modal="true" aria-labelledby="whoTitle" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const DEFAULT_CONFIG={unit:"",rate:0.1,buyIn:500,chips:[
  {name:"흰색",color:"#e9e6dc",value:1},{name:"빨강",color:"#c0392b",value:5},
  {name:"파랑",color:"#2c5aa0",value:10},{name:"초록",color:"#2e7d4f",value:25},{name:"검정",color:"#222222",value:100}]};
const S={tab:"sched",games:[],avail:[],config:DEFAULT_CONFIG,db:null,dbReady:false,canWrite:true,
  me:load("me",""),month:monthKey(new Date()),localSlots:null,confirmDel:null,
  form:null};

function load(k,d){try{const v=localStorage.getItem("pk_"+k);return v?JSON.parse(v):d}catch(e){return d}}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function monthKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function today(){const d=new Date();return monthKey(d)+"-"+String(d.getDate()).padStart(2,"0")}
function hex(s){return Array.from(new TextEncoder().encode(s)).map(b=>b.toString(16).padStart(2,"0")).join("")}
function r1(n){return Math.round(n*10)/10}
function fmt(n){n=r1(n);const s=(Math.abs(n)%1===0)?Math.abs(n).toFixed(0):Math.abs(n).toFixed(1);return (n>0?"+":n<0?"−":"")+s}

/* ---------- players ---------- */
const MEMBERS=["필규","승구","시즈","안테","지수","기정"];
function knownPlayers(){
  const tot={};MEMBERS.forEach(m=>tot[m]=0);
  S.games.forEach(g=>(g.results||[]).forEach(r=>{tot[r.name]=(tot[r.name]||0)+1}));
  S.avail.forEach(a=>{if(a.name&&!(a.name in tot))tot[a.name]=0});
  if(S.me&&!(S.me in tot))tot[S.me]=0;
  return Object.keys(tot).sort((a,b)=>tot[b]-tot[a]||a.localeCompare(b,"ko"));
}

function weekendDays(mk){
  const [y,m]=mk.split("-").map(Number);const out=[];const d=new Date(y,m-1,1);
  while(d.getMonth()===m-1){const w=d.getDay();if(w===6||w===0)out.push({key:monthKey(d)+"-"+String(d.getDate()).padStart(2,"0"),date:d.getDate(),dow:w});d.setDate(d.getDate()+1)}
  return out;
}
function availMap(){
  const map={};
  S.avail.filter(a=>a.month===S.month).forEach(a=>{map[a.name]=a.slots||{}});
  if(S.me&&S.localSlots&&S.localSlots.month===S.month)map[S.me]=S.localSlots.slots;
  return map;
}

function dday(key){const [y,m,d]=key.split("-").map(Number);const t=new Date();t.setHours(0,0,0,0);const n=Math.round((new Date(y,m-1,d)-t)/864e5);return n===0?"D-DAY":"D-"+n}

function normResults(rs){rs=rs||[];if(rs.every(r=>typeof r.win==="boolean"))return rs;
  const max=Math.max(...rs.map(r=>Number(r.amount)||0));
  return rs.map(r=>typeof r.win==="boolean"?r:{name:r.name,win:(Number(r.amount)||0)>0,top:(Number(r.amount)||0)===max&&max>0})}
function orderRes(rs){return [...normResults(rs)].sort((a,b)=>(b.top?1:0)-(a.top?1:0)||(b.win?1:0)-(a.win?1:0)||a.name.localeCompare(b.name,"ko"))}
function gameKey(g){return String(g.date||"")+"|"+String(g.created||0)}

    <div class="counts">${CHIPS.map((ch,j)=>`<label><span class="cname">${ch.name}</span><input type="number" min="0" inputmode="numeric" id="my-${j}" data-my="count" data-j="${j}" value="${my.counts[j]??""}" placeholder="0" aria-label="${ch.name} 칩 개수"></label>`).join("")}</div>
    <div class="ptotal"><span class="small muted">칩 <span class="num" id="my-pts">${won(myPts)}</span> − 넣은 돈 <span class="num" id="my-in">${won(myIn)}</span></span><span class="big ${cls(myPts-myIn)}" id="my-net">${won(myPts-myIn,1)}</span></div>
    <div class="spread"><span class="small" id="my-status">${myStatusHtml()}</span><button class="btn primary" data-act="mysubmit" ${S.db?"":"disabled"}>반영하기</button></div>
  </div><datalist id="plist2">${knownPlayers().map(p=>`<option value="${esc(p)}">`).join("")}</datalist></section>`;
  h+=`<section><div class="spread"><h2>모두의 칩</h2><span class="muted small">${ns.length}명 반영</span></div>`;
  if(!ns.length)h+=`<p class="muted small" style="margin:0">아직 반영한 사람이 없어요. 각자 위에서 칩 개수를 넣고 반영하기를 누르면 여기에 모여요.</p>`;
  else{
    h+=`<ol class="settle">${ns.map(n=>{const nm=n.p.name;return `<li><span><b>${esc(nm)}</b><br><span class="small muted">칩 ${won(n.pts)} · 넣은 돈 ${won(n.inn)}</span></span><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="num ${cls(n.net)}" style="font-weight:600">${won(n.net,1)}</span>
      ${S.confirmChipDel===nm?`<button class="btn danger small" data-act="chipdelyes" data-name="${esc(nm)}">삭제</button><button class="btn small" data-act="chipdelno">취소</button>`:`<button class="btn ghost small" data-act="chipdel" data-name="${esc(nm)}" aria-label="${esc(nm)} 입력 삭제">×</button>`}</span></li>`}).join("")}</ol>`;
    h+=`<div class="${diff===0?"":"notice"} small">${checkText(totPts,totIn,diff)}</div>`;
  }
  if(missing.length)h+=`<p class="small muted" style="margin:0">아직 안 한 사람: ${missing.map(esc).join(", ")}</p>`;
  h+=`</section>`;
  if(ns.length){
    h+=`<section><div class="spread"><h2>딜러 정산</h2><label class="row small muted">딜러 <select id="c-dealer" data-dealer="1">${ns.map(n=>`<option ${n.p.name===S.config.dealer?"selected":""}>${esc(n.p.name)}</option>`).join("")}</select></label></div>
      <p class="small muted" style="margin:0">딜러가 모두의 입금을 받고, 끝나면 각자 남은 칩만큼 돌려줘요.</p>${settleHtml(ns)}</section>`;
    h+=`<section>${S.confirmFinish?`<div class="panel" style="display:flex;flex-direction:column;gap:10px"><b>게임 기록에 저장할까요?</b><span class="small muted">${ns.length}명의 결과가 오늘 날짜로 저장되고, 모두의 칩 입력은 비워져요.</span><div class="row" style="justify-content:flex-end"><button class="btn" data-act="finishno">취소</button><button class="btn primary" data-act="finishyes">저장</button></div></div>`
      :`<div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="finish">게임 끝 · 기록에 저장</button></div>`}</section>`;
  }
  return h;
}
function checkText(totPts,totIn,diff){return diff===0?`칩 합계 <span class="num">${won(totPts)}</span> = 넣은 돈 합계. 딱 맞아요.`:`칩 합계 <span class="num">${won(totPts)}</span>, 넣은 돈 합계 <span class="num">${won(totIn)}</span>. <b class="num">${won(diff,1)}</b> 차이가 나요. 칩 개수나 추가금액을 다시 확인하세요.`}
function settleHtml(ns){
  const dealer=ns.some(n=>n.p.name===S.config.dealer)?S.config.dealer:ns[0].p.name;
  const inTot=ns.reduce((a,n)=>a+n.inn,0),outTot=ns.reduce((a,n)=>a+n.pts,0),left=inTot-outTot;
  return `<ol class="settle">${ns.map(n=>{const nm=n.p.name;const me=nm===dealer;
    return `<li><span>${esc(nm)}${me?' <span class="small" style="color:var(--gold)">딜러</span>':""}<br><span class="small muted">입금 ${won(n.inn)}</span></span><span class="num" style="text-align:right"><span class="small muted">${me?"본인 몫":"돌려받을 돈"}</span><br><b>${won(n.pts)}</b></span></li>`}).join("")}</ol>
  <div class="small" style="margin-top:8px">딜러가 받은 돈 <b class="num">${won(inTot)}</b> · 돌려줄 돈 <b class="num">${won(outTot)}</b> · ${left===0?'<span class="pos">남는 돈 없이 딱 맞아요</span>':`<span class="neg">${won(-left,1)} 차이. 칩 개수를 다시 확인하세요</span>`}</div>`;
}
let cfgTimer=null,cfgWriting=false,cfgDirty=false;
function cfgChanged(){S.cfgLocal=true;clearTimeout(cfgTimer);cfgTimer=setTimeout(flushCfg,700)}
async function flushCfg(){
  if(!S.db)return;if(cfgWriting){cfgDirty=true;return}cfgWriting=true;
  try{await S.db.doc("config/main").set(JSON.parse(JSON.stringify(S.config)))}catch(e){writeFailed(e)}
  cfgWriting=false;S.cfgLocal=false;if(cfgDirty){cfgDirty=false;flushCfg()}
}
function saveMy(){save("mychip",S.my)}
function updateCalcNumbers(){
  const my=S.my,p=points(my),i=inOf(my);const a=document.getElementById("my-pts"),b=document.getElementById("my-in"),c=document.getElementById("my-net"),d=document.getElementById("my-status");
  if(a)a.textContent=won(p);if(b)b.textContent=won(i);if(c){c.textContent=won(p-i,1);c.className="big "+cls(p-i)}if(d)d.innerHTML=myStatusHtml();
}
async function submitMine(){
  const name=(S.me||"").trim();if(!name){S.whoOpen=true;renderWho();return}
  if(!S.db){toast("저장 기능이 연결되지 않았어요");return}
  S.my.name=name;saveMy();
  const doc={kind:"chip",name,counts:CHIPS.map((c,j)=>Number(S.my.counts[j])||0),extra:Number(S.my.extra)||0,updated:Date.now()};
  try{await S.db.doc("config/chip-"+hex(name)).set(doc);toast("반영했어요")}catch(e){writeFailed(e)}
}

/* ---------- who am i ---------- */
S.whoOpen=false;
function renderWho(){
  const m=document.getElementById("whoModal");const show=S.whoOpen||!S.me;m.hidden=!show;
  const btn=document.getElementById("meBtn");btn.hidden=!S.me;btn.textContent=S.me?`${S.me} ▾`:"";btn.setAttribute("aria-label",S.me?`${S.me}, 이름 바꾸기`:"");
  if(!show)return;
  m.innerHTML=`<div class="box"><div><h2 id="whoTitle">누구세요?</h2><p class="small muted" style="margin:4px 0 0">이 폰에서 쓸 이름을 골라주세요. 한 번 고르면 기억해요.</p></div>
    <div class="whogrid">${knownPlayers().map(p=>`<button type="button" data-who="${esc(p)}" aria-pressed="${p===S.me}">${esc(p)}</button>`).join("")}</div>
    <div class="row"><input type="text" id="whonew" placeholder="목록에 없으면 이름 입력" style="flex:1"><button class="btn" type="button" data-whoadd="1">확인</button></div>
    ${S.me?`<div class="row" style="justify-content:flex-end"><button class="btn ghost" type="button" data-whoclose="1">닫기</button></div>`:""}</div>`;
}
function setMe(n){n=n.trim();if(!n)return;S.me=n;S.localSlots=null;save("me",n);S.my={name:n,counts:[],extra:0};const sub=S.chipSubs.find(c=>c.name===n);if(sub){S.my.counts=[...sub.counts];S.my.extra=sub.extra||0}saveMy();S.whoOpen=false;render();toast(`${n} 님, 반가워요`)}
document.getElementById("whoModal").addEventListener("click",e=>{
  const w=e.target.closest("[data-who]");if(w){setMe(w.dataset.who);return}
  if(e.target.closest("[data-whoadd]")){setMe(document.getElementById("whonew").value);return}
  if(e.target.closest("[data-whoclose]")||(e.target.id==="whoModal"&&S.me)){S.whoOpen=false;renderWho()}});
document.getElementById("whoModal").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="whonew")setMe(e.target.value);if(e.key==="Escape"&&S.me){S.whoOpen=false;renderWho()}});
document.getElementById("meBtn").addEventListener("click",()=>{S.whoOpen=true;renderWho()});

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===S.tab));
  const app=document.getElementById("app");
  let pre="";
  if(S.dbReady&&!S.db)pre=`<div class="notice">아직 Firebase 설정이 연결되지 않았어요. index.html 위쪽의 FIREBASE_CONFIG에 설정값을 붙여넣으세요. 지금은 저장이 되지 않아요.</div>`;
  else if(!S.canWrite)pre=`<div class="notice">보기 전용으로 열려 있어요. 직접 입력하려면 방장에게 편집 권한을 요청하세요.</div>`;
  if(!document.getElementById("whoModal").contains(document.activeElement)||!S.whoOpen&&S.me)renderWho();
  app.innerHTML=pre+(S.tab==="sched"?renderSched():S.tab==="stats"?renderStats():renderCalc());
}

document.querySelector(".tabs").addEventListener("click",e=>{const t=e.target.closest(".tab");if(!t)return;S.tab=t.dataset.tab;save("tab",S.tab);render();window.scrollTo(0,0)});
document.getElementById("app").addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==="mprev"||a==="mnext"){S.monthTouched=true;const [y,m]=S.month.split("-").map(Number);S.month=monthKey(new Date(y,m-1+(a==="mprev"?-1:1),1));S.localSlots=null;subAvail();render()}
  else if(a==="day")toggleDay(b.dataset.day);
  else if(a==="meetnew"||a==="meetedit"||a==="fixday"){const mt=S.meet&&S.meet.date>=today()?S.meet:{};S.meetEdit={date:a==="fixday"?b.dataset.day:(mt.date||""),time:mt.time||"13:00 – 18:00",place:mt.place||"",address:mt.address||"",map:mt.map||"",memo:mt.memo||""};render();window.scrollTo(0,0)}
  else if(a==="meetcancel"){S.meetEdit=null;render()}
  else if(a==="meetsave")saveMeet();
  else if(a==="meetclear"){try{await S.db.doc("config/meet").delete();S.meet=null;S.meetEdit=null;render();toast("공지를 내렸어요")}catch(err){writeFailed(err)}}
  else if(a==="meetcopy"){const t=S.meet&&S.meet.address||"";try{await navigator.clipboard.writeText(t);toast("주소를 복사했어요")}catch(err){toast(t)}}
  else if(a==="newgame"){const ps=knownPlayers().slice(0,6);S.form={date:today(),title:`${new Date().getMonth()+1}월 모임`,note:"",rows:(ps.length?ps:["",""]).map(n=>({name:n,win:null,top:false}))};render()}
  else if(a==="fadd"){readForm();S.form.rows.push({name:"",win:null,top:false});render()}
  else if(a==="frm"){readForm();S.form.rows.splice(+b.dataset.i,1);render()}
  else if(a==="fcancel"){S.form=null;render()}
  else if(a==="fwin"){readForm();S.form.rows[+b.dataset.i].win=b.dataset.v==="1";render()}
  else if(a==="ftop"){readForm();const r=S.form.rows[+b.dataset.i];const on=!r.top;S.form.rows.forEach(x=>x.top=false);r.top=on;if(on)r.win=true;render()}
  else if(a==="fsave"){readForm();const f=S.form;const rows=f.rows.filter(r=>r.name.trim()&&typeof r.win==="boolean").map(r=>({name:r.name.trim(),win:r.win,top:!!r.top}));
    if(rows.length<2){toast("두 명 이상 ●/○ 를 골라주세요");return}
    if(await saveGame({date:f.date,title:f.title.trim()||"모임",note:f.note.trim(),results:rows,created:Date.now()})){S.form=null;render()}}
  else if(a==="del"){S.confirmDel=b.dataset.id;render()}
  else if(a==="delno"){S.confirmDel=null;render()}
  else if(a==="delyes"){try{await S.db.doc("games/"+b.dataset.id).delete();toast("삭제했어요")}catch(err){writeFailed(err)}S.confirmDel=null;render()}
  else if(a==="mysubmit")submitMine();
  else if(a==="chipdel"){S.confirmChipDel=b.dataset.name;render()}
  else if(a==="chipdelno"){S.confirmChipDel=null;render()}
  else if(a==="chipdelyes"){try{await S.db.doc("config/chip-"+hex(b.dataset.name)).delete();toast("삭제했어요")}catch(err){writeFailed(err)}S.confirmChipDel=null;render()}
  else if(a==="finish"){S.confirmFinish=true;render()}
  else if(a==="finishno"){S.confirmFinish=false;render()}
  else if(a==="finishyes"){const ns=nets();if(ns.length<2){toast("두 명 이상 반영해야 저장할 수 있어요");return}
    const ok=await saveGame({date:today(),title:`${new Date().getMonth()+1}월 모임`,note:"",results:ns.map(n=>({name:n.p.name,win:n.net>0,top:n.net>0&&n.net===ns[0].net})),created:Date.now()});
    if(ok){try{const batch=S.db.batch();ns.forEach(n=>batch.delete(S.db.doc("config/chip-"+hex(n.p.name))));await batch.commit()}catch(err){}
      S.my={name:S.my.name,counts:[],extra:0};saveMy();S.confirmFinish=false;S.tab="stats";render()}}
});
function readForm(){const f=S.form;if(!f)return;f.date=document.getElementById("f-date").value;f.title=document.getElementById("f-title").value;f.note=document.getElementById("f-note").value;
  document.querySelectorAll("[data-f]").forEach(el=>{f.rows[+el.dataset.i][el.dataset.f]=el.value})}
document.getElementById("app").addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.f&&S.form){S.form.rows[+el.dataset.i][el.dataset.f]=el.value}
  else if(el.dataset.my){const k=el.dataset.my;if(k==="name")S.my.name=el.value;else if(k==="extra")S.my.extra=Math.max(0,parseInt(el.value)||0);else S.my.counts[+el.dataset.j]=el.value===""?"":Math.max(0,parseInt(el.value)||0);saveMy();updateCalcNumbers()}
  else if(el.dataset.dealer){S.config.dealer=el.value;cfgChanged();render()}
  else if(el.dataset.s){const k=el.dataset.s;S.config[k]=k==="unit"?el.value:Math.max(0,parseFloat(el.value)||0);cfgChanged();updateCalcNumbers()}
});

/* ---------- data ---------- */
let unAvail=null;
function subAvail(){if(!S.db)return;if(unAvail)unAvail();
  unAvail=S.db.collection("avail").where("month","==",S.month).onSnapshot(snap=>{S.avail=snap.docs.map(d=>d.data());
    const mineSrv=S.avail.find(a=>a.name===S.me);
    if(S.localSlots&&!slotWriting&&!slotTimer&&mineSrv&&JSON.stringify(mineSrv.slots)===JSON.stringify(S.localSlots.slots))S.localSlots=null;
    if(S.tab==="sched"&&!(document.activeElement&&document.activeElement.matches("#app input")))render()},()=>{})}
S.tab=load("tab","sched");
const SEED={date:"2026-10",title:"10월 비정기모임",note:"☆ 필규 첫 1등 축하 ☆",created:1792240000000,results:[{name:"필규",win:true,top:true},{name:"승구",win:true,top:false},{name:"시즈",win:true,top:false},{name:"안테",win:false,top:false},{name:"지수",win:false,top:false},{name:"기정",win:false,top:false}]};
(function start(){
  const cfg=window.FIREBASE_CONFIG;S.dbReady=true;
  if(!window.firebase||!cfg||!cfg.projectId||String(cfg.apiKey).includes("여기에")){S.db=null;S.canWrite=false;render();return}
  try{firebase.initializeApp(cfg);S.db=firebase.firestore()}catch(e){S.db=null;S.canWrite=false;render();return}
  const db=S.db;let seeded=false;
  db.collection("games").onSnapshot(snap=>{
    if(snap.empty&&!snap.metadata.fromCache&&!seeded){seeded=true;db.doc("games/g-2026-10-irregular").set(SEED).catch(()=>{})}
    snap.docs.forEach(d=>{const g=d.data();if((g.results||[]).some(r=>"amount" in r)){db.doc("games/"+d.id).set({...g,results:normResults(g.results).map(r=>({name:r.name,win:r.win,top:!!r.top}))}).catch(()=>{})}});
    S.games=snap.docs.map(d=>({id:d.id,...d.data()}));if(!(document.activeElement&&document.activeElement.matches("input")))render()},e=>{console.error(e);toast("데이터를 불러오지 못했어요. Firestore 규칙을 확인하세요")});
  db.doc("config/main").onSnapshot(snap=>{if(snap.exists&&!S.cfgLocal){const d=snap.data();S.config={...DEFAULT_CONFIG,...JSON.parse(JSON.stringify(d))};
    if(!(S.tab==="calc"&&document.activeElement&&document.activeElement.matches("input")))render()}},()=>{});
  db.collection("config").where("kind","==","chip").onSnapshot(snap=>{S.chipSubs=snap.docs.map(d=>d.data());
    if(S.tab==="calc"){if(document.activeElement&&document.activeElement.matches("#app input"))updateCalcNumbers();else render()}},()=>{});
  db.doc("config/meet").onSnapshot(snap=>{S.meet=snap.exists?snap.data():null;if(S.tab==="sched"&&!S.meetEdit)render()},()=>{});
  subAvail();render();
  // 투표가 있는 가장 늦은 달(이번 달 이후)을 바로 보여주기
  db.collection("avail").where("month",">=",monthKey(new Date())).get().then(snap=>{
    if(S.monthTouched)return;
    const ms=snap.docs.map(d=>d.data()).filter(a=>a.slots&&Object.values(a.slots).some(isOn)).map(a=>a.month).sort();
    const target=ms[ms.length-1];if(target&&target!==S.month){S.month=target;S.localSlots=null;subAvail();render()}
  }).catch(()=>{});
})();
// clear timer flag after flush
const _f=flushSlots;flushSlots=async function(){slotTimer=null;return _f()};
})();
</script>

</body>
</html>
